services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "8888:8888"
      - "5000:5000"
      - "8000:8000"
      - "8501:8501"
    command: tail -f /dev/null

  dbt:
    image: xemuliam/dbt:duckdb
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DBT_PROFILES_DIR=/app
    command: tail -f /dev/null
